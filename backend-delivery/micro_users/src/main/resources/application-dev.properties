# ========== CONFIGURACIÓN DOCKER (Desarrollo en contenedores) ==========
spring.application.name=micro-usuarios
server.port=8089

eureka.instance.instance-id=${spring.application.name}

# Eureka Config
eureka.client.service-url.defaultZone=http://eureka:8762/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=usuarios
ribbon.ConnectTimeout=5000
ribbon.ReadTimeout=30000

# Database Config (Postgres) - Hostname de Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/users_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:Haikyuu1212}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Keycloak Resource Server Config
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://auth.ceiba-bar.local/realms/ceiba-bar}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/ceiba-bar/protocol/openid-connect/certs}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Keycloak Admin REST API (Service Account)
keycloak.admin.server-url=http://keycloak:8080
keycloak.admin.realm=ceiba-bar
keycloak.admin.client-id=micro-users-backend
keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET:VQjAAjxcBUNKr7JmXOKeCUqQAkFdhmu3}

# Init Admin Config
app.init-admin.name=${INIT_ADMIN_NAME:Joshua}
app.init-admin.lastName=${INIT_ADMIN_LASTNAME:Alvarez}
app.init-admin.email=${INIT_ADMIN_EMAIL:cristopher17@hotmail.com}
app.init-admin.password=${INIT_ADMIN_PASSWORD:170498}

# API Key interna para comunicacion inter-servicio
internal.api-key=${INTERNAL_API_KEY:ceiba-bar-internal-secret-2026}
