# ========== CONFIGURACIÓN DOCKER (Desarrollo en contenedores) ==========
spring.application.name=micro-customer
server.port=8088

eureka.instance.instance-id=${spring.application.name}

# Eureka Config
eureka.client.service-url.defaultZone=http://eureka:8762/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=customer
ribbon.ConnectTimeout=5000
ribbon.ReadTimeout=30000

# Database Config (Postgres) - Hostname de Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/customer_db
spring.datasource.username=postgres
spring.datasource.password=Haikyuu1212
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Keycloak Resource Server Config
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://auth.ceiba-bar.local/realms/ceiba-bar}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/ceiba-bar/protocol/openid-connect/certs}

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers,retries
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ========== RESILIENCE4J CONFIG ==========
# Circuit Breaker para llamadas al micro-usuarios (userClient)
resilience4j.circuitbreaker.instances.userClient.slidingWindowSize=6
resilience4j.circuitbreaker.instances.userClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userClient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userClient.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.userClient.automaticTransitionFromOpenToHalfOpenEnabled=true

# Retry para userClient: 3 intentos con espera exponencial
resilience4j.retry.instances.userClient.maxAttempts=3
resilience4j.retry.instances.userClient.waitDuration=500ms

# Bulkhead para userClient: limitar concurrencia
resilience4j.bulkhead.instances.userClient.maxConcurrentCalls=10
resilience4j.bulkhead.instances.userClient.maxWaitDuration=100ms
