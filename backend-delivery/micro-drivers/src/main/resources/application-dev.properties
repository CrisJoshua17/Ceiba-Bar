# ========== CONFIGURACIÓN DOCKER (Desarrollo en contenedores) ==========
spring.application.name=micro-drivers
server.port=8096

eureka.instance.instance-id=${spring.application.name}

# Eureka Config
eureka.client.service-url.defaultZone=http://eureka:8762/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=drivers
ribbon.ConnectTimeout=5000
ribbon.ReadTimeout=30000

# Database Config (Postgres) - Hostname de Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/drivers_db
spring.datasource.username=postgres
spring.datasource.password=Haikyuu1212
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Keycloak Resource Server Config
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/ceiba-bar
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/ceiba-bar/protocol/openid-connect/certs

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
