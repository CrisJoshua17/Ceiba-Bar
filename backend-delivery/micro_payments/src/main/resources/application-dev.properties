# ========== CONFIGURACIÓN DOCKER (Desarrollo en contenedores) ==========
server.port=8075
spring.application.name=micro-payments
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:4200/checkout/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:4200/checkout/cancel}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

eureka.instance.instance-id=${spring.application.name}

# Eureka Config
eureka.client.service-url.defaultZone=http://eureka:8762/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=payments
ribbon.ConnectTimeout=5000
ribbon.ReadTimeout=30000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Database Config (Postgres) - Hostname de Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/payments_db
spring.datasource.username=postgres
spring.datasource.password=Haikyuu1212
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Keycloak Resource Server Config
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/ceiba-bar/protocol/openid-connect/certs

# RabbitMQ Config (Saga Coreografiada)
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# PayPal Config
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
