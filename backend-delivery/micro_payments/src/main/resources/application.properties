server.port=8075
spring.application.name=micro-payments
spring.threads.virtual.enabled=true
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.success-url=${STRIPE_SUCCESS_URL}
stripe.cancel-url=${STRIPE_CANCEL_URL}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

eureka.instance.instance-id=${spring.application.name}

# Eureka Config
eureka.client.service-url.defaultZone=http://localhost:8762/eureka/
eureka.instance.prefer-ip-address=true
ribbon.ConnectTimeout=5000
ribbon.ReadTimeout=30000

# Database Config (Postgres)
spring.datasource.url=jdbc:postgresql://localhost:5433/payments_db
spring.datasource.username=postgres
spring.datasource.password=Haikyuu1212
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Keycloak Resource Server Config
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/ceiba-bar
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/ceiba-bar/protocol/openid-connect/certs

# JPA Config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true