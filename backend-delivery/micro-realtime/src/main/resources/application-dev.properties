# ========== CONFIGURACIÓN DOCKER (Desarrollo en contenedores) ==========
spring.application.name=micro-realtime
server.port=8099

eureka.instance.instance-id=${spring.application.name}

# Eureka Config
eureka.client.service-url.defaultZone=http://eureka:8762/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=realtime
ribbon.ConnectTimeout=5000
ribbon.ReadTimeout=30000

# Database Config (Postgres) - Cambio a hostname de Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/orders_db
spring.datasource.username=postgres
spring.datasource.password=Haikyuu1212
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Keycloak Resource Server Config
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/ceiba-bar/protocol/openid-connect/certs

# MongoDB Config - Cambio a hostname de Docker
spring.data.mongodb.uri=mongodb://mongo:27017/tracking

# Kafka Config - Cambio a hostname de Docker
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=realtime-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Jackson Config
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# RabbitMQ Config (Saga Coreografiada)
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ========== RESILIENCE4J CONFIG ==========
# Circuit Breaker para llamadas al micro-drivers (driverClient)
resilience4j.circuitbreaker.instances.driverClient.slidingWindowSize=6
resilience4j.circuitbreaker.instances.driverClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.driverClient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.driverClient.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.driverClient.automaticTransitionFromOpenToHalfOpenEnabled=true

# Retry para driverClient: 3 intentos con espera
resilience4j.retry.instances.driverClient.maxAttempts=3
resilience4j.retry.instances.driverClient.waitDuration=500ms
resilience4j.retry.instances.driverClient.enableExponentialBackoff=true
resilience4j.retry.instances.driverClient.exponentialBackoffMultiplier=2

# Bulkhead para driverClient: limitar concurrencia
resilience4j.bulkhead.instances.driverClient.maxConcurrentCalls=5
resilience4j.bulkhead.instances.driverClient.maxWaitDuration=100ms

# Exponer métricas de Resilience4j en Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers,retries
management.health.circuitbreakers.enabled=true
