<app-navbar-simple></app-navbar-simple>

<div class="containerBase w-100">
  <div class="container w-100 containerLog">
    <p-card class="cardLog text-start">
      <ng-template pTemplate="header">
        <span class="customHeader mx-2">Crear Cuenta</span>
      </ng-template>

      <div class="p-fluid text-center">

        <div class="mb-4">
          <i class="pi pi-user-plus" style="font-size: 3rem; color: var(--ceiba-leaf);"></i>
          <p class="mt-3 text-color-secondary">
            Crea tu cuenta de Ceiba Bar.<br>
            El registro es seguro y rápido.
          </p>
        </div>

        <!-- Botón principal: redirige a Keycloak Register -->
        <p-button
          id="btn-register-keycloak"
          label="Crear mi cuenta"
          icon="pi pi-user-plus"
          [loading]="loading"
          class="w-full mt-2"
          [styleClass]="'w-full registerButton'"
          (click)="register()">
        </p-button>

        <p class="mt-4 mb-1">¿Ya tienes cuenta?</p>
        <p-button
          id="btn-goto-login"
          label="Iniciar Sesión"
          icon="pi pi-sign-in"
          severity="secondary"
          [outlined]="true"
          class="w-full mt-1"
          [styleClass]="'w-full loginButton'"
          (click)="goToLogin()">
        </p-button>

      </div>
    </p-card>
  </div>
</div>
