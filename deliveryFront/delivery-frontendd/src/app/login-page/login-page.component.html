<app-navbar-simple></app-navbar-simple>

<div class="containerBase w-100">
  <div class="container w-100 containerLog">
    <p-card class="cardLog text-start">
      <ng-template pTemplate="header">
        <span class="customHeader mx-2">Iniciar Sesión</span>
      </ng-template>

      <div class="p-fluid text-center">

        <div class="mb-4">
          <i class="pi pi-lock" style="font-size: 3rem; color: var(--ceiba-leaf);"></i>
          <p class="mt-3 text-color-secondary">
            Inicia sesión con tu cuenta de Ceiba Bar.<br>
            Serás redirigido de forma segura.
          </p>
        </div>

        <!-- Botón principal: redirige a Keycloak Login -->
        <p-button
          id="btn-login-keycloak"
          label="Iniciar Sesión"
          icon="pi pi-sign-in"
          [loading]="loading"
          class="w-full mt-2"
          [styleClass]="'w-full'"
          (click)="login()">
        </p-button>

        <p class="mt-4 mb-1">¿No tienes cuenta?</p>
        <p-button
          id="btn-goto-register"
          label="Regístrate"
          icon="pi pi-user-plus"
          severity="secondary"
          [outlined]="true"
          class="w-full mt-1"
          [styleClass]="'w-full registerButton'"
          [routerLink]="['/registro']">
        </p-button>

      </div>
    </p-card>
  </div>
</div>
