<header class="sticky top-0 z-40 w-full bg-ceiba-paper border-b border-ceiba-line shadow-xs">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between">
    
    <div class="flex items-center gap-4">
      <button (click)="visible = true"
        class="lg:hidden p-2 rounded-full hover:bg-ceiba-cream border border-ceiba-line text-ceiba-ink cursor-pointer flex items-center justify-center">
        <i class="pi pi-bars text-lg"></i>
      </button>

      <a routerLink="/drivers/dashboard" class="flex items-center gap-3 no-underline">
        <div class="w-10 h-10 rounded-full overflow-hidden border border-ceiba-line shadow-xs">
          <img src="assets/images/logoarbol.jpg" alt="Ceiba Bar Logo" class="w-full h-full object-cover" />
        </div>
        <span class="font-bold text-base tracking-wider text-ceiba-ink hidden sm:block">
          Ceiba Bar Repartidor
        </span>
      </a>
    </div>

    <!-- Desktop nav links -->
    <nav class="hidden lg:flex items-center gap-8 font-semibold text-sm tracking-wider text-ceiba-ink">
      <a routerLink="/drivers/history" class="flex items-center gap-2 transition-colors hover:text-ceiba-leaf no-underline">
        <i class="pi pi-history text-sm"></i>
        Historial
      </a>
      <a routerLink="/drivers/deliveries" class="flex items-center gap-2 transition-colors hover:text-ceiba-leaf no-underline">
        <i class="pi pi-truck text-sm"></i>
        Entregas
      </a>
      <a routerLink="/my-profile" class="flex items-center gap-2 transition-colors hover:text-ceiba-leaf no-underline">
        <i class="pi pi-user text-sm"></i>
        Perfil
      </a>
    </nav>

    <!-- Right Actions -->
    <div class="flex items-center gap-4">
      <div class="hidden lg:flex items-center gap-3 text-right">
        <p class="text-xs font-bold text-ceiba-ink m-0">{{ user?.name || 'Repartidor' }}</p>
        <button (click)="cerrarSesion()"
          class="p-2 rounded-full hover:bg-ceiba-coral/10 hover:text-ceiba-coral text-ceiba-ink border border-transparent hover:border-ceiba-coral/20 cursor-pointer flex items-center justify-center"
          title="Cerrar Sesión">
          <i class="pi pi-sign-out text-sm"></i>
        </button>
      </div>
    </div>

  </div>
</header>

<!-- Left Drawer for Mobile Navigation -->
<p-drawer [(visible)]="visible" position="left" [blockScroll]="true" [dismissible]="true"
  [showCloseIcon]="true" [style]="{'width': '300px'}" styleClass="ceiba-sidebar-left">
  <ng-template pTemplate="header">
    <div class="flex items-center gap-3 py-2">
      <div class="w-12 h-12 rounded-full overflow-hidden border border-ceiba-line shadow-xs">
        <img src="assets/images/logoarbol.jpg" alt="Ceiba Bar Logo" class="w-full h-full object-cover" />
      </div>
      <div class="text-left">
        <h4 class="font-bold text-sm text-ceiba-ink m-0">{{ user?.name || 'Repartidor' }}</h4>
        <p class="text-[10px] text-ceiba-ink/60 m-0">{{ user?.email || 'Panel Driver' }}</p>
      </div>
    </div>
  </ng-template>

  <div class="flex flex-col h-full py-4 justify-between">
    <div class="space-y-2">
      <a routerLink="/drivers/history" (click)="visible = false"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold tracking-wide hover:bg-ceiba-line/10 text-ceiba-ink no-underline transition-all">
        <i class="pi pi-history text-ceiba-ink/75"></i>
        Historial
      </a>
      <a routerLink="/drivers/deliveries" (click)="visible = false"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold tracking-wide hover:bg-ceiba-line/10 text-ceiba-ink no-underline transition-all">
        <i class="pi pi-truck text-ceiba-ink/75"></i>
        Entregas
      </a>
      <a routerLink="/my-profile" (click)="visible = false"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold tracking-wide hover:bg-ceiba-line/10 text-ceiba-ink no-underline transition-all">
        <i class="pi pi-user text-ceiba-ink/75"></i>
        Perfil
      </a>
    </div>

    <div class="pt-4 border-t border-ceiba-line mt-auto">
      <button pButton label="Cerrar Sesión" icon="pi pi-sign-out"
        class="w-full justify-start gap-3 border-ceiba-coral text-ceiba-coral hover:bg-ceiba-coral hover:text-white rounded-xl py-3 font-bold transition-all p-button-outlined"
        (click)="cerrarSesion(); visible = false">
      </button>
    </div>
  </div>
</p-drawer>
