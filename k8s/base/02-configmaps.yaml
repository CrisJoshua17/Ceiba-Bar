apiVersion: v1
kind: ConfigMap
metadata:
  name: ceiba-config
  namespace: ceiba-bar
data:
  # Spring Environment
  SPRING_PROFILES_ACTIVE: "dev"

  # Databases Hosts & Ports
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  MONGO_HOST: "mongodb"
  MONGO_PORT: "27017"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Messaging / Streaming
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  ZOOKEEPER_CONNECT: "zookeeper:2181"

  # Infrastructure URLs
  EUREKA_SERVER_URL: "http://eureka:8762/eureka/"
  KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "ceiba-bar"
  KEYCLOAK_CLIENT_ID: "ceiba-frontend-angular"
  
  # External Integrations Mode
  PAYPAL_MODE: "sandbox"
