apiVersion: v1
kind: Service
metadata:
  name: usuarios
  namespace: ceiba-bar
spec:
  ports:
    - port: 8089
      targetPort: 8089
  selector:
    app: usuarios
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios
  namespace: ceiba-bar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios
  template:
    metadata:
      labels:
        app: usuarios
    spec:
      containers:
        - name: usuarios
          image: usuarios:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8089
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: ceiba-config
                  key: SPRING_PROFILES_ACTIVE
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: ceiba-config
                  key: EUREKA_SERVER_URL
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/users_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ceiba-secrets
                  key: postgres-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ceiba-secrets
                  key: postgres-password
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ceiba-secrets
                  key: keycloak-client-secret
            - name: INIT_ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: ceiba-secrets
                  key: init-admin-name
            - name: INIT_ADMIN_LASTNAME
              valueFrom:
                secretKeyRef:
                  name: ceiba-secrets
                  key: init-admin-lastname
            - name: INIT_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ceiba-secrets
                  key: init-admin-email
            - name: INIT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ceiba-secrets
                  key: init-admin-password
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ceiba-secrets
                  key: internal-api-key
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8089
            initialDelaySeconds: 150
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 50
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8089
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 50
---
